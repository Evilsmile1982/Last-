<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
  >

  <meta name="theme-color" content="#05070a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>Auto Check</title>

  <link rel="icon" type="image/png" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<main class="app">

  <!-- ==========================================
       HERO
       ========================================== -->

  <section class="hero">

    <img
      class="hero-image"
      src="assets/hero.jpg"
      alt="Auto Check"
    >

    <div class="hero-dark"></div>

    <!-- LOGO -->
    <div class="logo-container">
      <img
        class="main-logo"
        src="assets/logo-overlay.png"
        alt="Auto Check Logo"
      >
    </div>

  </section>


  <!-- ==========================================
       HAUPTMENÜ
       ========================================== -->

  <section class="dashboard">


    <!-- ================= MEIN AUTO ================= -->

    <button
      class="card card-red slide-left"
      data-target="my-car"
    >

      <div class="icon red-icon">

        <svg viewBox="0 0 64 64">
          <path
            d="M14 35l5-15c1-3 3-5 7-5h12c4 0 6 2 7 5l5 15"
            fill="none"
            stroke="currentColor"
            stroke-width="4"
            stroke-linecap="round"
          />

          <rect
            x="10"
            y="34"
            width="44"
            height="15"
            rx="4"
            fill="none"
            stroke="currentColor"
            stroke-width="4"
          />

          <circle
            cx="20"
            cy="50"
            r="4"
            fill="currentColor"
          />

          <circle
            cx="44"
            cy="50"
            r="4"
            fill="currentColor"
          />

        </svg>

      </div>

      <div class="card-title">
        Mein Auto
      </div>

      <div class="card-subtitle">
        Fahrzeug &amp; Details
      </div>

      <div class="arrow">
        ›
      </div>

    </button>


    <!-- ================= REPARATUREN ================= -->

    <button
      class="card card-blue slide-right"
      data-target="repairs"
    >

      <div class="icon blue-icon">

        <svg viewBox="0 0 64 64">

          <path
            d="M39 12c-6 0-11 4-13 9l7 7-18 18c-3 3-3 7 0 10s7 3 10 0l18-18 7 7c5-2 9-7 9-13 0-2 0-4-1-6l-11 5-7-7 5-11c-2-1-4-1-6-1z"
            fill="currentColor"
          />

        </svg>

      </div>

      <div class="card-title">
        Reparaturen
      </div>

      <div class="card-subtitle">
        Reparaturen verwalten
      </div>

      <div class="arrow">
        ›
      </div>

    </button>


    <!-- ================= PICKERL ================= -->

    <button
      class="card card-green slide-left"
      data-target="inspection"
    >

      <div class="icon green-icon">

        <svg viewBox="0 0 64 64">

          <circle
            cx="32"
            cy="32"
            r="23"
            fill="none"
            stroke="currentColor"
            stroke-width="4"
          />

          <circle
            cx="32"
            cy="32"
            r="3"
            fill="currentColor"
          />

          <path
            d="M32 13v19l12 8"
            fill="none"
            stroke="currentColor"
            stroke-width="4"
            stroke-linecap="round"
          />

          <path
            d="M32 7v6M32 51v6M7 32h6M51 32h6"
            stroke="currentColor"
            stroke-width="3"
            stroke-linecap="round"
          />

        </svg>

      </div>

      <div class="card-title">
        Pickerl/TÜV
      </div>

      <div class="card-subtitle">
        Termine &amp; Fristen
      </div>

      <div class="arrow">
        ›
      </div>

    </button>


    <!-- ================= WARTUNGEN ================= -->

    <button
      class="card card-orange slide-right"
      data-target="maintenance"
    >

      <div class="icon orange-icon">

        <svg viewBox="0 0 64 64">

          <path
            d="M38 11c-7 1-12 7-12 14 0 3 1 6 3 8L12 50l6 6 17-17c2 2 5 3 8 3 7 0 13-5 14-12l-11 5-8-8 5-11z"
            fill="currentColor"
          />

          <path
            d="M14 14l36 36"
            stroke="currentColor"
            stroke-width="5"
            stroke-linecap="round"
          />

        </svg>

      </div>

      <div class="card-title">
        Wartungen
      </div>

      <div class="card-subtitle">
        Verschiedenes
      </div>

      <div class="arrow">
        ›
      </div>

    </button>


    <!-- ================= GESAMTBLICK ================= -->

    <button
      class="card card-purple slide-left"
      data-target="overview"
    >

      <div class="icon purple-icon">

        <svg viewBox="0 0 64 64">

          <rect
            x="16"
            y="8"
            width="32"
            height="48"
            rx="4"
            fill="none"
            stroke="currentColor"
            stroke-width="4"
          />

          <path
            d="M24 20h16M24 29h16M24 38h12M24 47h9"
            stroke="currentColor"
            stroke-width="4"
            stroke-linecap="round"
          />

        </svg>

      </div>

      <div class="card-title">
        Gesamtblick
      </div>

      <div class="card-subtitle">
        Die wichtigsten Infos
      </div>

      <div class="arrow">
        ›
      </div>

    </button>


    <!-- ================= REIFEN ================= -->

    <button
      class="card card-teal slide-right"
      data-target="tires"
    >

      <div class="icon teal-icon">

        <svg viewBox="0 0 64 64">

          <path
            d="M24 9c-7 4-10 13-10 23s3 19 10 23h16c7-4 10-13 10-23S47 13 40 9z"
            fill="none"
            stroke="currentColor"
            stroke-width="4"
          />

          <ellipse
            cx="32"
            cy="32"
            rx="8"
            ry="22"
            fill="none"
            stroke="currentColor"
            stroke-width="3"
          />

          <path
            d="M24 16h16M23 24h18M23 40h18M24 48h16"
            stroke="currentColor"
            stroke-width="3"
            stroke-linecap="round"
          />

        </svg>

      </div>

      <div class="card-title">
        Reifen
      </div>

      <div class="card-subtitle">
        Größen, Dimensionen<br>
        und Alter
      </div>

      <div class="arrow">
        ›
      </div>

    </button>

  </section>


  <div class="slogan">
    Verliere nicht die Übersicht
  </div>

</main>


<div
  class="toast"
  role="status"
  aria-live="polite"
></div>


<script src="app.js"></script>

</body>
</html>
