<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta name="theme-color" content="#05070a">

  <title>AUTO CHECK</title>

  <!-- BILD 2 als App-/Browser-Icon -->
  <link rel="icon" type="image/png" href="assets/app-icon.png">
  <link rel="apple-touch-icon" href="assets/app-icon.png">

  <link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="app">

  <!-- =====================================================
       HERO
       ===================================================== -->

  <section class="hero">

    <!-- Hauptbild -->
    <img
      src="assets/hero.jpg"
      class="hero-background"
      alt="Auto Check"
    >

    <div class="hero-overlay"></div>

    <!-- AUTO CHECK LOGO -->
    <div class="hero-logo">
      <img
        src="assets/logo-overlay.png"
        alt="AUTO CHECK"
      >
    </div>

  </section>


  <!-- =====================================================
       HAUPTMENÜ
       ===================================================== -->

  <main class="menu">


    <!-- ===================================================
         OBEN LINKS
         fährt von RECHTS
         =================================================== -->

    <button
      class="menu-card card-red top-card"
      data-menu="auto"
    >

      <div class="card-icon">

        <!-- Auto Icon -->
        <svg viewBox="0 0 100 100">
          <path
            d="M20 53
               L27 32
               Q29 26 36 26
               H64
               Q71 26 73 32
               L80 53"
            fill="none"
            stroke="currentColor"
            stroke-width="6"
            stroke-linecap="round"
          />

          <rect
            x="15"
            y="50"
            width="70"
            height="27"
            rx="8"
            fill="none"
            stroke="currentColor"
            stroke-width="6"
          />

          <circle
            cx="29"
            cy="78"
            r="7"
            fill="currentColor"
          />

          <circle
            cx="71"
            cy="78"
            r="7"
            fill="currentColor"
          />

          <path
            d="M30 43H70"
            stroke="currentColor"
            stroke-width="5"
            stroke-linecap="round"
          />
        </svg>

      </div>

      <div class="card-text">

        <strong>Mein Auto</strong>

        <span>
          Fahrzeug &amp; Details
        </span>

      </div>

      <div class="card-arrow">›</div>

    </button>


    <!-- ===================================================
         OBEN MITTE
         fährt von RECHTS
         =================================================== -->

    <button
      class="menu-card card-blue top-card"
      data-menu="repairs"
    >

      <div class="card-icon">

        <!-- Schraubenschlüssel -->
        <svg viewBox="0 0 100 100">

          <path
            d="M62 17
               C52 17 44 25 44 35
               C44 39 45 42 48 45
               L20 73
               C16 77 16 84 20 88
               C24 92 31 92 35 88
               L63 60
               C66 63 70 64 74 64
               C84 64 92 56 92 46
               C92 43 91 39 90 36
               L76 43
               L66 33
               L73 19
               C69 18 66 17 62 17Z"
            fill="currentColor"
          />

        </svg>

      </div>

      <div class="card-text">

        <strong>Reparaturen</strong>

        <span>
          Reparaturen verwalten
        </span>

      </div>

      <div class="card-arrow">›</div>

    </button>


    <!-- ===================================================
         OBEN RECHTS
         fährt von RECHTS
         =================================================== -->

    <button
      class="menu-card card-green top-card"
      data-menu="inspection"
    >

      <div class="card-icon">

        <!-- Uhr / Pickerl -->
        <svg viewBox="0 0 100 100">

          <circle
            cx="50"
            cy="50"
            r="34"
            fill="none"
            stroke="currentColor"
            stroke-width="6"
          />

          <circle
            cx="50"
            cy="50"
            r="5"
            fill="currentColor"
          />

          <path
            d="M50 24V50L68 61"
            fill="none"
            stroke="currentColor"
            stroke-width="6"
            stroke-linecap="round"
          />

          <path
            d="M50 8V18
               M50 82V92
               M8 50H18
               M82 50H92"
            fill="none"
            stroke="currentColor"
            stroke-width="5"
            stroke-linecap="round"
          />

        </svg>

      </div>

      <div class="card-text">

        <strong>Pickerl/TÜV</strong>

        <span>
          Termine &amp; Fristen
        </span>

      </div>

      <div class="card-arrow">›</div>

    </button>


    <!-- ===================================================
         UNTEN LINKS
         fährt von LINKS
         =================================================== -->

    <button
      class="menu-card card-orange bottom-card"
      data-menu="maintenance"
    >

      <div class="card-icon">

        <!-- Werkzeug -->
        <svg viewBox="0 0 100 100">

          <path
            d="M59 17
               C50 18 43 26 43 35
               C43 39 45 43 48 46
               L19 75
               C15 79 15 85 19 89
               C23 93 29 93 33 89
               L62 60
               C65 63 69 65 74 65
               C83 65 91 58 92 49
               L77 56
               L66 45
               L73 30
               C69 22 64 18 59 17Z"
            fill="currentColor"
          />

          <path
            d="M18 20L80 82"
            stroke="currentColor"
            stroke-width="9"
            stroke-linecap="round"
          />

        </svg>

      </div>

      <div class="card-text">

        <strong>Wartungen</strong>

        <span>
          Verschiedenes
        </span>

      </div>

      <div class="card-arrow">›</div>

    </button>


    <!-- ===================================================
         UNTEN MITTE
         fährt von LINKS
         =================================================== -->

    <button
      class="menu-card card-purple bottom-card"
      data-menu="overview"
    >

      <div class="card-icon">

        <!-- Dokument -->
        <svg viewBox="0 0 100 100">

          <rect
            x="27"
            y="13"
            width="46"
            height="74"
            rx="6"
            fill="none"
            stroke="currentColor"
            stroke-width="6"
          />

          <path
            d="M38 32H62
               M38 45H62
               M38 58H58
               M38 71H53"
            fill="none"
            stroke="currentColor"
            stroke-width="6"
            stroke-linecap="round"
          />

        </svg>

      </div>

      <div class="card-text">

        <strong>Gesamtblick</strong>

        <span>
          Die wichtigsten Infos
        </span>

      </div>

      <div class="card-arrow">›</div>

    </button>


    <!-- ===================================================
         UNTEN RECHTS
         fährt von LINKS
         =================================================== -->

    <button
      class="menu-card card-teal bottom-card"
      data-menu="tires"
    >

      <div class="card-icon">

        <!-- Reifen -->
        <svg viewBox="0 0 100 100">

          <path
            d="M34 13
               C24 19 19 33 19 50
               C19 67 24 81 34 87
               H66
               C76 81 81 67 81 50
               C81 33 76 19 66 13Z"
            fill="none"
            stroke="currentColor"
            stroke-width="6"
          />

          <ellipse
            cx="50"
            cy="50"
            rx="13"
            ry="31"
            fill="none"
            stroke="currentColor"
            stroke-width="5"
          />

          <path
            d="M35 27H65
               M32 39H68
               M32 61H68
               M35 73H65"
            fill="none"
            stroke="currentColor"
            stroke-width="4"
            stroke-linecap="round"
          />

        </svg>

      </div>

      <div class="card-text">

        <strong>Reifen</strong>

        <span>
          Größen, Dimensionen<br>
          und Alter
        </span>

      </div>

      <div class="card-arrow">›</div>

    </button>

  </main>


  <!-- =====================================================
       UNTERMENÜ
       ===================================================== -->

  <section
    id="submenu"
    class="submenu"
    aria-hidden="true"
  >

    <div class="submenu-box">

      <button
        id="closeSubmenu"
        class="submenu-close"
      >
        ×
      </button>

      <div
        id="submenuIcon"
        class="submenu-icon"
      ></div>

      <h2 id="submenuTitle">
        Auto
      </h2>

      <p id="submenuDescription">
        Auswahl
      </p>

      <div
        id="submenuOptions"
        class="submenu-options"
      ></div>

    </div>

  </section>

</div>


<script src="app.js"></script>

</body>
</html>
