name: Android APK bauen

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Auto Check APK
    runs-on: ubuntu-24.04

    steps:

      # =====================================================
      # 1. Repository
      # =====================================================

      - name: Repository auschecken
        uses: actions/checkout@v4


      # =====================================================
      # 2. Node.js
      # =====================================================

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # =====================================================
      # 3. Java
      # =====================================================

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'


      # =====================================================
      # 4. Android SDK installieren
      # =====================================================

      - name: Android SDK installieren
        shell: bash
        run: |
          set -e

          SDK_ROOT="$RUNNER_TEMP/android-sdk"
          CMDLINE_TOOLS="$SDK_ROOT/cmdline-tools/latest"
          SDKMANAGER="$CMDLINE_TOOLS/bin/sdkmanager"

          echo "SDK_ROOT=$SDK_ROOT"

          mkdir -p "$CMDLINE_TOOLS"

          cd "$RUNNER_TEMP"

          echo "Lade Android Command Line Tools..."

          curl -L --fail \
            "https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip" \
            -o android-commandline-tools.zip

          echo "Entpacke Android Command Line Tools..."

          rm -rf "$RUNNER_TEMP/cmdline-tools"

          unzip -q \
            android-commandline-tools.zip \
            -d "$RUNNER_TEMP"

          cp -R \
            "$RUNNER_TEMP/cmdline-tools/." \
            "$CMDLINE_TOOLS/"

          echo "Prüfe sdkmanager..."

          test -f "$SDKMANAGER"

          chmod +x "$SDKMANAGER"

          echo "sdkmanager gefunden:"
          "$SDKMANAGER" --version

          echo "Setze Android-Umgebung..."

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "$CMDLINE_TOOLS/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export PATH="$CMDLINE_TOOLS/bin:$SDK_ROOT/platform-tools:$PATH"

          echo "Akzeptiere Android-Lizenzen..."

          yes | "$SDKMANAGER" --licenses > /dev/null || true

          echo "Installiere Android Komponenten..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK erfolgreich eingerichtet."


      # =====================================================
      # 5. Android SDK prüfen
      # =====================================================

      - name: Android SDK prüfen
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          "$SDKMANAGER" --version

          adb version

          ls -la "$ANDROID_SDK_ROOT/platforms"

          ls -la "$ANDROID_SDK_ROOT/build-tools"


      # =====================================================
      # 6. Web-App vorbereiten
      # =====================================================

      - name: Web-App vorbereiten
        shell: bash
        run: |
          set -e

          rm -rf web
          mkdir -p web

          cp -R extracted/. web/

          echo "Web-App Dateien:"
          find web -maxdepth 2 -type f | sort


      # =====================================================
      # 7. Node Projekt erstellen
      # =====================================================

      - name: package.json erstellen
        shell: bash
        run: |
          cat > package.json <<'EOF'
          {
            "name": "auto-check",
            "version": "1.0.0",
            "private": true,
            "description": "Auto Check Android App",
            "dependencies": {
              "@capacitor/core": "7.4.4",
              "@capacitor/android": "7.4.4"
            },
            "devDependencies": {
              "@capacitor/cli": "7.4.4"
            }
          }
          EOF

          cat package.json


      # =====================================================
      # 8. Capacitor konfigurieren
      # =====================================================

      - name: Capacitor konfigurieren
        shell: bash
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.evilsmile1982.autocheck",
            "appName": "Auto Check",
            "webDir": "web",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

          cat capacitor.config.json


      # =====================================================
      # 9. NPM installieren
      # =====================================================

      - name: NPM installieren
        run: npm install


      # =====================================================
      # 10. Capacitor Android Projekt
      # =====================================================

      - name: Android Projekt erstellen
        run: npx cap add android


      # =====================================================
      # 11. Web-App nach Android übertragen
      # =====================================================

      - name: Web-App synchronisieren
        run: npx cap sync android


      # =====================================================
      # 12. Android Projekt prüfen
      # =====================================================

      - name: Android Projekt prüfen
        shell: bash
        run: |
          echo "Android Projekt:"
          find android -maxdepth 2 -type f | sort | head -100


      # =====================================================
      # 13. APK bauen
      # =====================================================

      - name: Debug APK bauen
        working-directory: android
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew \
            assembleDebug \
            --no-daemon \
            --stacktrace


      # =====================================================
      # 14. APK prüfen
      # =====================================================

      - name: APK prüfen
        shell: bash
        run: |
          set -e

          echo "Gefundene APK Dateien:"

          find android/app/build/outputs \
            -type f \
            -name "*.apk" \
            -print

          test -f \
            android/app/build/outputs/apk/debug/app-debug.apk

          echo "APK erfolgreich erstellt."


      # =====================================================
      # 15. APK als Download bereitstellen
      # =====================================================

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Auto-Check-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
