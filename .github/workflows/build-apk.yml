name: Android APK bauen

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: APK erstellen
    runs-on: ubuntu-latest

    steps:

      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK vorbereiten
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          yes | sdkmanager --licenses > /dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Web-App vorbereiten
        run: |
          mkdir -p web
          cp -r extracted/. web/

      - name: package.json erstellen
        run: |
          cat > package.json <<'EOF'
          {
            "name": "auto-check",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "latest"
            },
            "devDependencies": {
              "@capacitor/cli": "latest"
            }
          }
          EOF

      - name: Capacitor Konfiguration erstellen
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.evilsmile1982.autocheck",
            "appName": "Auto Check",
            "webDir": "web"
          }
          EOF

      - name: NPM installieren
        run: npm install

      - name: Android-Projekt erstellen
        run: npx cap add android

      - name: Web-App synchronisieren
        run: npx cap sync android

      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Auto-Check-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
